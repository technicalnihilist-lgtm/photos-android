<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Photos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;--bg:#fff;--fg:#000;--sub:#8a8a8e;--gbg:rgba(255,255,255,.28);--ac:#007aff;color-scheme:light;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000;--fg:#fff;--gbg:rgba(60,60,64,.35);color-scheme:dark}}
:root[data-theme=dark]{--bg:#000;--fg:#fff;--gbg:rgba(60,60,64,.35);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:0 0 130px}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:34px;margin:14px 16px 8px;letter-spacing:.2px}
h2{font-size:17px;margin:18px 16px 8px}
/* Prismal-style glass: blur + saturation, specular rim, chromatic fringe, press ripple */
.glass{position:relative;background:var(--gbg);-webkit-backdrop-filter:blur(14px) saturate(1.8) brightness(1.06);backdrop-filter:blur(14px) saturate(1.8) brightness(1.06);
box-shadow:0 8px 28px rgba(0,0,0,.2),inset 0 0 0 .5px rgba(255,255,255,.45),inset 1.5px 1.5px 1px rgba(255,255,255,.75),inset -1.5px -1.5px 1px rgba(255,255,255,.35),inset 3px 0 5px rgba(255,70,70,.14),inset -3px 0 5px rgba(70,110,255,.16),inset 0 0 14px rgba(255,255,255,.18)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:var(--pa,0);transition:opacity .35s;background:radial-gradient(circle at var(--px,50%) var(--py,50%),rgba(255,255,255,.6),transparent 55%)}
.topfade{position:fixed;left:0;right:0;top:0;height:calc(env(safe-area-inset-top,0px) + 56px);z-index:5;pointer-events:none;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);background:linear-gradient(var(--bg),transparent);-webkit-mask:linear-gradient(#000 40%,transparent);mask:linear-gradient(#000 40%,transparent)}
.seg{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:6;display:flex;margin:0 auto 10px;width:260px;border-radius:99px;padding:3px}
.seg button{flex:1;padding:7px 0;border-radius:99px;font-size:14px;font-weight:600;transition:background .25s}
.seg .on{background:rgba(120,120,128,.3)}
.g{display:grid;grid-template-columns:repeat(var(--c),1fr);gap:1.5px}
.ph{aspect-ratio:1;background:#999 center/cover;position:relative;display:block;width:100%}
.ph i{position:absolute;left:5px;bottom:3px;color:#fff;font-style:normal;font-size:13px;text-shadow:0 1px 3px #0008}
.cnt{text-align:center;color:var(--sub);font-weight:600;margin:20px}
.alb{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 16px}
.alb button{text-align:left}.alb .cv{aspect-ratio:1;border-radius:12px;background:#999 center/cover;margin-bottom:6px}
.alb small{color:var(--sub);display:block}
.top{display:flex;align-items:center;gap:10px;margin:8px 16px}
.cb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.search{margin:0 16px 10px;display:flex;align-items:center;gap:8px;padding:0 14px;height:44px;border-radius:99px;background:rgba(120,120,128,.16);color:var(--sub)}
.search input{flex:1;border:0;background:none;font-size:17px;color:var(--fg);outline:0;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px}
.chips button{padding:8px 14px;border-radius:99px;background:rgba(120,120,128,.16);font-weight:600;font-size:14px;white-space:nowrap}
#tabs{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(340px,calc(100% - 32px));height:64px;border-radius:99px;padding:4px;display:flex;touch-action:none;user-select:none}
#tabs .t{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--fg);position:relative;z-index:2;pointer-events:none;transition:color .25s}
#tabs .t.on{color:var(--ac)}
.drop{position:absolute;top:4px;bottom:4px;left:4px;border-radius:99px;z-index:1;background:rgba(255,255,255,.35);transition:transform .5s cubic-bezier(.34,1.56,.64,1),scale .3s cubic-bezier(.34,1.56,.64,1)}
#tabs.down .drop{scale:1.14 1.2;transition:scale .3s cubic-bezier(.34,1.56,.64,1)}
#v{position:fixed;inset:0;z-index:30;background:#000;color:#fff;display:flex;flex-direction:column;animation:in .3s}
#v[hidden]{display:none}
@keyframes in{from{opacity:0;transform:scale(.95)}}
.vt,.vb{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:3;transition:opacity .25s,transform .25s}
.vt{top:calc(env(safe-area-inset-top,0px) + 8px)}
.vb{bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
.vb .bar{display:flex;gap:6px;margin:auto;padding:4px;border-radius:99px;background:var(--gbg)}
.vb .cb{width:52px;height:48px;border-radius:99px}
#v.bare .vt{opacity:0;transform:translateY(-12px);pointer-events:none}#v.bare .vb{opacity:0;transform:translateY(12px);pointer-events:none}
.vd{text-align:center;padding:6px 16px;border-radius:99px;font-size:13px;line-height:1.25}.vd b{display:block;font-size:15px}
#stage{flex:1;display:grid;place-items:center;overflow:hidden;touch-action:none}
#vi{max-width:100%;max-height:100%;object-fit:contain;will-change:transform;-webkit-user-drag:none}
.fav{color:#ff375f}.fav svg{fill:#ff375f}
#sheet{position:fixed;z-index:40;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:480px;margin:auto;border-radius:32px;padding:20px 22px;color:#fff;transform:translateY(130%);transition:transform .5s cubic-bezier(.34,1.3,.64,1);background:rgba(40,40,44,.45)}
#sheet.open{transform:none}#sheet p{margin:10px 0;display:flex;justify-content:space-between}#sheet span{opacity:.7}
#toast{position:fixed;z-index:50;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);translate:-50% -200%;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;color:#fff;transition:translate .45s cubic-bezier(.34,1.56,.64,1);background:rgba(40,40,44,.5)}
#toast.on{translate:-50% 0}
.menu{position:fixed;z-index:60;min-width:210px;border-radius:24px;padding:6px;color:var(--fg)}.menu.dk{color:#fff;background:rgba(40,40,44,.5)}.menu[hidden]{display:none}
.menu button{display:block;width:100%;text-align:left;padding:12px 16px;border-radius:18px;font-size:16px}.menu button:active{background:rgba(128,128,128,.25)}
#ed{position:fixed;inset:0;z-index:35;background:#000;color:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:in .3s}#ed[hidden]{display:none}
.et{display:flex;justify-content:space-between;gap:8px;padding:8px 16px}.pill{padding:10px 18px;border-radius:99px;font-weight:600;font-size:15px;color:#fff}.pill.ok{background:var(--ac)}
#ev{flex:1;min-height:0;display:grid;place-items:center;padding:8px}#ecv{max-width:100%;max-height:100%;border-radius:6px}
#eb{min-height:128px;padding-top:4px}.row{display:flex;gap:8px;overflow-x:auto;padding:4px 16px}
.row button{padding:9px 14px;border-radius:99px;background:rgba(255,255,255,.14);font-weight:600;font-size:14px;white-space:nowrap;position:relative;color:#fff}.row button.on{background:#fff;color:#000}.row button.m::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--ac)}
.row .fb{padding:0;background:none!important;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:#fff!important}.row .fb canvas{width:60px;height:80px;border-radius:10px;border:2px solid transparent}.row .fb.on canvas{border-color:var(--ac)}
.sl{padding:14px 24px 8px}.sl div{display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:9px;background:rgba(255,255,255,.3)}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:26px;margin-top:-10px;border-radius:99px;background:#fff;box-shadow:0 2px 8px #0006}
input[type=range]::-moz-range-track{height:6px;border-radius:9px;background:rgba(255,255,255,.3)}input[type=range]::-moz-range-thumb{width:34px;height:26px;border-radius:99px;background:#fff;border:0}
/* ===== Prismal engine: every glass param is a CSS var ===== */
.glass{-webkit-backdrop-filter:blur(calc(var(--bl) * var(--abl,1))) saturate(var(--sat)) brightness(calc(1 + var(--bri) + var(--abr,0))) var(--lens,blur(0px));backdrop-filter:blur(calc(var(--bl) * var(--abl,1))) saturate(var(--sat)) brightness(calc(1 + var(--bri) + var(--abr,0))) var(--lens,blur(0px));
box-shadow:0 var(--dsy) var(--dsb) rgba(0,0,0,var(--dsa)),inset 0 0 0 999px rgba(var(--tc),var(--ta)),inset 0 2px var(--dib) rgba(0,0,0,var(--dia)),inset 0 0 0 .5px rgba(255,255,255,.4)}
.glass::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:var(--sp,none) 0 0/100% 100% no-repeat,linear-gradient(135deg,rgba(255,255,255,var(--sh)) 0%,transparent 45%,transparent 62%,rgba(255,255,255,calc(var(--sh) * .5)) 100%)}
.glass::after{background:radial-gradient(circle at var(--px,50%) var(--py,50%),#fff calc(var(--rr) * .5),transparent var(--rr));opacity:calc(var(--pa,0) * var(--ri))}
.topfade{-webkit-backdrop-filter:blur(var(--tf));backdrop-filter:blur(var(--tf))}
.drop{transition:transform .5s cubic-bezier(.34,var(--so),.64,1),scale .3s cubic-bezier(.34,var(--so),.64,1)}#tabs.down .drop{scale:var(--ps) calc(var(--ps) + .06)}
.cb{transition:transform .45s cubic-bezier(.34,var(--so),.64,1)}.cb.pr{transform:scale(var(--ps))}
.menu,#sheet{border-radius:var(--cr)}.menu{width:min(320px,calc(100vw - 24px))}
.mi{overflow-y:auto;border-radius:inherit;padding:4px;overscroll-behavior:contain}
.lg{padding:2px 12px 12px}.lh{font-weight:800;font-size:13px;opacity:.7;text-transform:uppercase;margin:12px 0 8px;letter-spacing:.5px}.ls{font-size:12px;font-weight:700;opacity:.55;margin:16px 0 4px;text-transform:uppercase}
.cl{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;margin:8px 0 2px}.row2{display:flex;flex-wrap:wrap;gap:6px}
.menu .row2 button,.menu .sg button{display:inline-block;width:auto;padding:7px 12px;border-radius:99px;font-size:13px;background:rgba(128,128,128,.22)}.menu .sg{display:flex;gap:6px}.menu .sg button{flex:1;text-align:center}.menu button.on:not(.tg){background:var(--ac);color:#fff}
.menu button.tg{width:50px;height:30px;padding:0;border-radius:99px;background:rgba(128,128,128,.35);position:relative;flex:none}.tg i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px #0004;transition:transform .4s cubic-bezier(.34,var(--so),.64,1)}.menu button.tg.on{background:#34c759}.tg.on i{transform:translateX(20px)}
.menu input[type=range]::-webkit-slider-runnable-track{background:rgba(128,128,128,.35)}.menu input[type=range]::-moz-range-track{background:rgba(128,128,128,.35)}.menu input[type=color]{width:42px;height:28px;border:0;padding:0;background:none}
:root{--gbg:rgba(255,255,255,.14)}
#tabs .bg{position:absolute;inset:0;border-radius:99px}
#tabs .bg,#tabs .drop{-webkit-backdrop-filter:none;backdrop-filter:none;background:none}.dc{position:absolute;inset:0;width:100%;height:100%;border-radius:inherit;z-index:0;pointer-events:none}.drop::before,.drop::after{z-index:1}
</style></head><body>
<svg id='defs' width='0' height='0' style='position:absolute'></svg><main id="main"></main><div class="topfade"></div>
<nav id="tabs"><div class="bg glass cg"><canvas class="dc"></canvas></div><div class="drop glass cg"><canvas class="dc"></canvas></div></nav>
<div id="v" hidden>
<div class="vt"><button class="cb glass" id="vc" aria-label="Back"></button><div class="vd glass" id="vd"></div><button class="cb glass" id="vm" aria-label="More"></button></div>
<div id="stage"><img id="vi" alt=""></div>
<div class="vb"><div class="bar glass"><button class="cb" id="bs" aria-label="Share"></button><button class="cb" id="bf" aria-label="Favorite"></button><button class="cb" id="bi" aria-label="Info"></button><button class="cb" id="be" aria-label="Adjust"></button><button class="cb" id="bd" aria-label="Delete"></button></div></div>
</div>
<div id="menu" class="menu glass" hidden></div>
<div id="ed" hidden><div class="et"><button class="pill glass" id="ec">Cancel</button><button class="pill glass" id="er">Revert</button><button class="pill ok" id="ek">Done</button></div><div id="ev"><canvas id="ecv"></canvas></div><div id="eb"></div><div class="seg glass" id="etabs" style="position:static;margin:8px auto 12px"><button data-t="0">Adjust</button><button data-t="1">Filters</button><button data-t="2">Crop</button></div></div>
<div id="sheet" class="glass"></div><div id="toast" class="glass"></div>
<script>
const $=s=>document.querySelector(s),I={
ph:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="9" cy="9" r="2"/><path d="M3 17l5-5 4 4 3-3 6 6"/>',
al:'<rect x="3" y="7" width="18" height="14" rx="3"/><path d="M6 3.5h12M4.5 5.2h15"/>',
se:'<circle cx="11" cy="11" r="6.500"/><path d="M16 16l5 5"/>',
he:'<path d="M12 20s-7-4.400-7-10a4 4 0 0 1 7-2.500A4 4 0 0 1 19 10c0 5.600-7 10-7 10z"/>',
sh:'<path d="M12 15V3M8 7l4-4 4 4M6 11H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1"/>',
in:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.500v.01"/>',
tr:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',bk:'<path d="M15 5l-7 7 7 7"/>',dt:'<g fill="currentColor" stroke="none"><circle cx="5" cy="12" r="1.800"/><circle cx="12" cy="12" r="1.800"/><circle cx="19" cy="12" r="1.800"/></g>',ad:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'},
ic=k=>`<svg viewBox="0 0 24 24">${I[k]}</svg>`;
/* ---- no bundled demo photos: the library starts empty ---- */
const names=['Sunset','Night','Hills','Ocean','Flowers'];let P=[];
let tab=0,mode='All',q='',alb=null,cur=P,ci=0,rows=0;
const fm=(d,o)=>d.toLocaleDateString('en-US',o);
function grid(l,m){const cols={Months:5,Days:3,All:3}[m];let h='',last=null;
l.forEach(p=>{const k=m=='All'?'':fm(p.d,m=='Months'?{month:'long',year:'numeric'}:{weekday:'short',month:'short',day:'numeric'});
if(k!==last){if(last!==null)h+='</div>';if(k)h+=`<h2>${k}</h2>`;h+=`<div class="g" style="--c:${cols}">`;last=k}
h+=`<button class="ph" data-id="${p.id}" style="background-image:url(${p.url})">${p.fav?'<i>♥</i>':''}</button>`});
return h+'</div>'}
const find=a=>a=='Favorites'?P.filter(p=>p.fav):P.filter(p=>p.tag==a);
function render(){const m=$('#main');
if(tab==0&&!alb){cur=P;m.innerHTML=`<div class="top" style="justify-content:space-between"><h1 style="margin:6px 0">Library</h1><button class="cb glass" id="lm" style="color:var(--fg)" aria-label="More">${ic('dt')}</button></div><div class="seg glass">${['Months','Days','All'].map(k=>`<button data-m="${k}" class="${k==mode?'on':''}">${k}</button>`).join('')}</div>${grid(P,mode)}<p class="cnt">${P.length} Photos</p>`}
else if(tab==0||tab==1&&alb){const a=alb;cur=find(a);m.innerHTML=`<div class="top"><button class="cb glass" id="ab">${ic('bk')}</button><h1 style="margin:0">${a}</h1></div>${grid(cur,'All')}<p class="cnt">${cur.length} Photos</p>`;$('#ab').style.color='var(--fg)'}
else if(tab==1){m.innerHTML=`<h1>Collections</h1><div class="alb">${['Favorites',...names].map(a=>{const l=find(a);return`<button data-a="${a}"><div class="cv" style="background-image:url(${l[0]?l[0].url:''})"></div>${a}<small>${l.length}</small></button>`}).join('')}</div>`}
else{if(!$('#res')){m.innerHTML=`<h1>Search</h1><label class="search glass">${ic('se')}<input id="q" placeholder="Photos, Moments, Places" value="${q}"></label><div class="chips">${names.map(n=>`<button class="glass" data-q="${n}">${n}</button>`).join('')}</div><div id="res"></div>`}
const s=q.toLowerCase();cur=P.filter(p=>!s||p.tag.toLowerCase().includes(s)||fm(p.d,{month:'long'}).toLowerCase().includes(s));$('#res').innerHTML=grid(cur,'All')+(cur.length?'':'<p class="cnt">No Results</p>')}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-id],[data-m],[data-a],[data-q],#ab');if(!t)return;
if(t.dataset.id){ci=cur.findIndex(p=>p.id==t.dataset.id);openV()}
else if(t.dataset.m){mode=t.dataset.m;render()}else if(t.dataset.a){alb=t.dataset.a;scrollTo(0,0);render()}
else if(t.dataset.q){q=t.dataset.q;$('#q').value=q;render()}else{alb=null;render()}});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;render()}});
/* press ripple like press_ripple.agsl */
document.addEventListener('pointerdown',e=>{const g=e.target.closest('.glass');if(!g)return;const r=g.getBoundingClientRect();g.style.setProperty('--px',e.clientX-r.left+'px');g.style.setProperty('--py',e.clientY-r.top+'px');g.style.setProperty('--pa',1);
const off=()=>{g.style.setProperty('--pa',0);removeEventListener('pointerup',off);removeEventListener('pointercancel',off)};addEventListener('pointerup',off);addEventListener('pointercancel',off)});
/* tab bar with draggable liquid droplet */
const bar=$('#tabs'),drop=bar.querySelector('.drop'),TB=[['ph','Library'],['al','Collections'],['se','Search']];
TB.forEach(([k,n])=>bar.insertAdjacentHTML('beforeend',`<div class="t">${ic(k)}${n}</div>`));
const tw=()=>(bar.clientWidth-8)/3;
function pos(x,anim){drop.style.transition=anim?'':'none';drop.style.transform=`translateX(${x}px)`}
function setTab(i){tab=i;alb=null;bar.querySelectorAll('.t').forEach((e,k)=>e.classList.toggle('on',k==i));pos(i*tw(),1);scrollTo(0,0);render()}
drop.style.width='calc((100% - 8px)/3)';
const X=e=>Math.max(0,Math.min(2*tw(),e.clientX-bar.getBoundingClientRect().left-4-tw()/2));
bar.addEventListener('pointerdown',e=>{bar.setPointerCapture(e.pointerId);bar.classList.add('down');pos(X(e),1)});
bar.addEventListener('pointermove',e=>{if(bar.classList.contains('down'))pos(X(e),0)});
const up=e=>{if(!bar.classList.contains('down'))return;bar.classList.remove('down');setTab(Math.round(X(e)/tw()))};
bar.addEventListener('pointerup',up);bar.addEventListener('pointercancel',up);
/* viewer */
const v=$('#v'),vi=$('#vi'),cp=()=>cur[ci];
$('#vc').innerHTML=ic('bk');$('#bs').innerHTML=ic('sh');$('#bf').innerHTML=ic('he');$('#bi').innerHTML=ic('in');$('#bd').innerHTML=ic('tr');
function show(){const p=cp();vi.src=p.url;$('#vd').innerHTML=`<b>${fm(p.d,{weekday:'long',month:'short',day:'numeric'})}</b>${p.d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}`;$('#bf').classList.toggle('fav',p.fav)}
function openV(){v.hidden=false;v.classList.remove('bare');show()}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('on'),1800)}
function like(){cp().fav=!cp().fav;show();render()}
$('#vc').onclick=()=>{v.hidden=true;$('#sheet').classList.remove('open')};
$('#bf').onclick=like;
$('#bs').onclick=async()=>{try{await navigator.share({title:'Photo',text:`${cp().tag} · ${fm(cp().d,{dateStyle:'medium'})}`})}catch(e){toast('Share sheet isn’t available here')}};
$('#bi').onclick=()=>{const p=cp();$('#sheet').innerHTML=`<b style="font-size:19px">Info</b><p><span>Date</span>${fm(p.d,{dateStyle:'long'})}</p><p><span>Subject</span>${p.tag}</p><p><span>File</span>IMG_${String(4000+p.id)}.JPG</p><p><span>Size</span>360 × 480</p>`;$('#sheet').classList.toggle('open')};
$('#bd').onclick=()=>{const id=cp().id;P=P.filter(p=>p.id!=id);cur=cur.filter(p=>p.id!=id);toast('Photo deleted');render();if(!cur.length)return $('#vc').click();ci=Math.min(ci,cur.length-1);show()};
let sx,sy,dx,dy,t0=0,dn=0;
